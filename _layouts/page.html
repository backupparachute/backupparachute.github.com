---
layout: master
---

<section class="container py-5">
  {% if page.title %}
    <header class="mb-4">
      <h1 class="display-5 fw-bold">{{ page.displayTitle | default: page.title }}</h1>
      {% if page.subtitle %}<p class="lead text-muted">{{ page.subtitle }}</p>{% endif %}
    </header>
  {% endif %}

  <div class="page-body">
    {{ content }}
  </div>
</section>
